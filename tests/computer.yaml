name: ocs-test

memory: 512

cpu:
  tier: 2

gpu:
  tier: 3
  screen:
    width: 80
    height: 25
    maxDepth: 8

eeprom:
  bios: builtin
  boot: auto

filesystems:
  - label: openos
    path: builtin
    mount: /
    readonly: false

components:
  keyboard: true
  mouse: false

internet:
  enabled: true
  timeout: 30
  tcp: true
  userAgent: OCShell-test
  # ocplay now implements OpenComputers' address filtering and denies
  # loopback by default. Local end-to-end tests need an explicit allow rule.
  filteringRules:
    - allow ip:127.0.0.1/8
    - deny private
    - deny bogon
    - allow default

run:
  timeout: 0
  interactive: false
  terminateDelay: 0
